name: Bootstrap CO5085 repository scaffold

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/manifest.txt"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether archive is complete
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/manifest.txt ]; then
            echo "Archive manifest not uploaded yet; waiting for remaining chunks."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source .bootstrap/manifest.txt
          actual="$(find .bootstrap -maxdepth 1 -type f -name 'xz-*' | wc -l | tr -d ' ')"
          if [ "$actual" != "$chunks" ]; then
            echo "Expected $chunks chunks but found $actual; waiting."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Expand verified scaffold
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .bootstrap/manifest.txt
          cat $(find .bootstrap -maxdepth 1 -type f -name 'xz-*' | sort) | base64 --decode > /tmp/co5085-scaffold.tar.xz
          echo "$sha256  /tmp/co5085-scaffold.tar.xz" | sha256sum -c -
          tar -xJf /tmp/co5085-scaffold.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit scaffold
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No scaffold changes to commit."
          else
            git commit -m "Bootstrap tested CO5085 coursework scaffold"
            git push origin HEAD:main
          fi
