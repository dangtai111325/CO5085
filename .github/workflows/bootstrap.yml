name: Bootstrap final CO5085 repository

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap2/manifest.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap2/manifest.txt
          source .bootstrap2/manifest.txt
          actual="$(find .bootstrap2 -maxdepth 1 -type f -name 'xz-*' | wc -l | tr -d ' ')"
          test "$actual" = "$chunks"
          cat $(find .bootstrap2 -maxdepth 1 -type f -name 'xz-*' | sort) | base64 --decode > /tmp/co5085-final.tar.xz
          echo "$sha256  /tmp/co5085-final.tar.xz" | sha256sum -c -

      - name: Expand tested scaffold without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          cp .github/workflows/pages.yml /tmp/pages.yml
          tar -xJf /tmp/co5085-final.tar.xz -C .
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          cp /tmp/pages.yml .github/workflows/pages.yml
          rm -f .github/workflows/quality.yml .github/workflows/report.yml
          rm -rf .bootstrap .bootstrap2

      - name: Commit tested source scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install tested CO5085 coursework scaffold"
          git push origin HEAD:main
