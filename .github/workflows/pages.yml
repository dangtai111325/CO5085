name: Publish coursework to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble public files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          site = Path('_site')
          site.mkdir()
          shutil.copytree('public', site / 'public')
          shutil.copytree('assignment', site / 'assignment')
          shutil.copytree('source_code', site / 'source_code')
          (site / 'report').mkdir()
          shutil.copy2('report/CO5085_Report.pdf', site / 'report/CO5085_Report.pdf')
          (site / 'datasets').mkdir()
          shutil.copy2('datasets/README.md', site / 'datasets/README.md')
          shutil.copy2('README.md', site / 'README.md')
          shutil.copy2('.nojekyll', site / '.nojekyll')
          html = Path('public/index.html').read_text(encoding='utf-8')
          (site / 'index.html').write_text(html.replace('href="../', 'href="./'), encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
