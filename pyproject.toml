[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co5085-coursework"
version = "0.1.0"
description = "CO5085 Deep Learning and Computer Vision coursework"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "E1*", "E2*", "E3*", "A1*", "A2*"]
