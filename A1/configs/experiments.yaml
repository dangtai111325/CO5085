  - {id: C4, family: resnet18, pretrained: true, mode: full}
  - {id: T1, family: vit_tiny, pretrained: false, mode: scratch}
  - {id: T2, family: vit_tiny, pretrained: true, mode: head}
  - {id: T3, family: vit_tiny, pretrained: true, mode: partial}
  - {id: T4, family: vit_tiny, pretrained: true, mode: full}
